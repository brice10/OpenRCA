services:
  docs:
    container_name: openrca-docs
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - docs_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

volumes:
  docs_node_modules: